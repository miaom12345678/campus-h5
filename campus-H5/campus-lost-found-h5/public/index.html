<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#3A7AFE" />
  <title>校园失物招领</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="app">
    <header class="navbar">
      <button class="nav-back" id="navBack" style="display:none">‹</button>
      <span class="nav-title" id="navTitle">校园失物招领</span>
    </header>

    <main class="page-host" id="pageHost"></main>

    <nav class="tabbar" id="tabbar">
      <a class="tab-item" data-tab="square" href="#/">
        <span class="tab-icon">🏠</span><span class="tab-text">广场</span>
        <span class="tab-badge" id="badgeMsg" style="display:none"></span>
      </a>
      <a class="tab-item" data-tab="publish" href="#/publish">
        <span class="tab-icon tab-add">＋</span><span class="tab-text">发布</span>
      </a>
      <a class="tab-item" data-tab="message" href="#/message">
        <span class="tab-icon">💬</span><span class="tab-text">消息</span>
        <span class="tab-badge" id="badgeMsg2" style="display:none"></span>
      </a>
      <a class="tab-item" data-tab="mine" href="#/mine">
        <span class="tab-icon">👤</span><span class="tab-text">我的</span>
      </a>
    </nav>
  </div>

  <div class="toast" id="toast" style="display:none"></div>
  <div class="modal-mask" id="modal" style="display:none">
    <div class="modal-box">
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-content" id="modalContent"></div>
      <div class="modal-btns">
        <button class="modal-btn" id="modalCancel">取消</button>
        <button class="modal-btn primary" id="modalOk">确定</button>
      </div>
    </div>
  </div>
  <div class="preview-mask" id="previewMask" style="display:none">
    <img id="previewImg" alt="预览" />
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
